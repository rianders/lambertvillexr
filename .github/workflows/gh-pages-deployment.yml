name: Deploy Nuxt site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  HIDE_DEMOS: true
  # Upstream production is served from the custom domain root via GitHub Pages.
  # Forks published under <owner>.github.io/<repo>/ need a repo subpath base URL.
  NUXT_APP_BASE_URL: ${{ github.repository_owner == 'lambertvillenj' && '/' || format('/{0}/', github.event.repository.name) }}
  META_URL: ${{ github.repository_owner == 'lambertvillenj' && 'https://flowingtogether.lambertvillenj.org/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Static HTML export with Nuxt
        run: npm run generate
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: .output/public # The folder the action should deploy.
          token: ${{ secrets.GITHUB_TOKEN }}
