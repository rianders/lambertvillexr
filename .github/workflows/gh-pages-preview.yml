name: Deploy branch preview to Pages

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  HIDE_DEMOS: true
  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/previews/${{ github.ref_name }}/
  META_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${{ github.ref_name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Static HTML export with Nuxt
        run: npm run generate
      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public
          target-folder: previews/${{ github.ref_name }}
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
